<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Prevents Gadget UI frames from navigating away from their srcdoc. DO NOT REMOVE.
         'self' and the Live View origin are for the Browser pane: its frame loads a link on this
         origin that redirects to the Live View. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src srcdoc: 'self' https://live.browser.run;">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Cloudflare OS</title>
    <!-- Principle: the theme from the ps-theme cookie, set before the first paint. @ps/ui's
         THEME_BOOT, the same on every Principle app; scripts/principle-theme.test.mjs in Agent
         Dispatch keeps it so. -->
    <script>(function(){try{var m=/(?:^|;\s*)ps-theme=(light|dark|charcoal)(?:;|$)/.exec(document.cookie),t=m?m[1]:matchMedia('(prefers-color-scheme: dark)').matches?'charcoal':'light',r=document.documentElement;r.dataset.theme=t;r.dataset.mode=t==='light'?'light':'dark'}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
